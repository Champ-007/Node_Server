<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="home.css">
    <script src="home.js" defer></script>
</head>
<body class="dark">
    <header>
        <div class="header-inner">
            <h1>Champ's Task Management</h1>
            <button id="darkMode" class="accent-btn">Toggle Dark Mode</button>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="card-head">
                <h2>Tasks</h2>
                <div class="card-actions">
                    <button id="filterButton" class="text-btn" aria-expanded="false" aria-controls="filterPanel">Filter</button>
                    <button id="addTaskButton" class="accent-btn icon-btn" aria-label="Add task">+</button>

                    <!-- Opens over the page when Filter is pressed -->
                    <div id="filterPanel" class="panel filter-panel">
                        <h3 class="panel-title">Filters</h3>
                        <label class="field"><span>Course</span><input id="filterCourse" type="search" placeholder="CS 101"></label>
                        <label class="field"><span>Name</span><input id="filterName" type="search" placeholder="Lab 3"></label>
                        <div class="field">
                            <span>Sort by</span>
                            <div class="sort-buttons">
                                <button type="button" data-sort="due" class="active" data-direction="up">Due date</button>
                                <button type="button" data-sort="priority">Priority</button>
                                <button type="button" data-sort="remaining">Remaining</button>
                                <button type="button" data-sort="name">Name</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Shown until loadTasks() finishes -->
            <div id="loader" class="spinner" aria-label="Loading tasks"></div>
            <p id="status" class="status" hidden></p>

            <ul id="taskList"></ul>
        </section>
        <section class="card">
            <p>Lorem Ipsum.</p>
        </section>
    </main>
</body>
</html>
